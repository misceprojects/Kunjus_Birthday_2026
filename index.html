<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Kunjus Countdown</title>
<meta name="description" content="Five deliveries. One birthday.">
<meta name="robots" content="noindex, nofollow">
<style>
@font-face{font-family:"Fredoka";src:url(day4/fonts/fredoka-latin-wght-normal.woff2) format("woff2");font-weight:300 700;font-display:swap}
@font-face{font-family:"Anton";src:url(day4/fonts/anton-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Caveat";src:url(day4/fonts/caveat-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
:root{--ink:#1a1240;--gold:#ffd66b;--pink:#ff6fa3;--round:"Fredoka",system-ui,sans-serif;--display:"Anton",Impact,sans-serif;--hand:"Caveat",cursive}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#ffe7f0}
body{min-height:100vh;font-family:var(--round);color:var(--ink);background:radial-gradient(circle at 20% 0%,#ffd1e3,transparent 50%),radial-gradient(circle at 100% 30%,#e3d4ff,transparent 45%),radial-gradient(circle at 0% 100%,#fff0bf,transparent 50%),#fff4f8}
.wrap{max-width:560px;margin:0 auto;padding:max(26px,env(safe-area-inset-top)) 16px 40px}
header{text-align:center;margin-bottom:20px}
.kick{display:inline-block;background:var(--ink);color:var(--gold);font:700 12px/1 var(--round);letter-spacing:.24em;text-transform:uppercase;padding:8px 14px;border-radius:30px}
h1{font:400 clamp(44px,13vw,72px)/.9 var(--display);text-transform:uppercase;margin:14px 0 8px;letter-spacing:.01em}
h1 span{color:var(--pink)}
.sub{font-size:clamp(15px,4.2vw,18px);opacity:.8}
.hand{font:600 clamp(22px,6vw,28px)/1.1 var(--hand);color:var(--pink);margin-top:6px}

.list{display:grid;gap:12px}
.card{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:12px 14px;box-shadow:0 5px 0 var(--ink);text-decoration:none;color:inherit;position:relative;transition:transform .1s}
a.card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.card .ic{width:62px;height:62px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;border:2.5px solid var(--ink)}
.card .n{font:700 11px/1 var(--round);letter-spacing:.2em;text-transform:uppercase;opacity:.6}
.card .t{font:700 clamp(17px,4.8vw,20px)/1.15 var(--round);margin:4px 0 2px}
.card .d{font-size:13px;opacity:.7}
.card .go{font:700 14px/1 var(--round);background:var(--ink);color:#fff;border-radius:30px;padding:10px 14px;white-space:nowrap}
.card.locked{background:#f1ecf7;border-style:dashed;box-shadow:none;cursor:default}
.card.locked .ic{background:#e2d9ee !important;filter:grayscale(1);opacity:.7}
.card.locked .t{color:#7a6f8f}
.card.locked .go{background:transparent;color:#7a6f8f;border:2px dashed #b8aecb;font:700 12px/1 ui-monospace,monospace;padding:8px 9px}
.card.today{animation:glow 1.8s ease-in-out infinite}
.card.today::before{content:"NEW";position:absolute;top:-10px;right:14px;background:var(--pink);color:#fff;font:700 11px/1 var(--round);letter-spacing:.14em;padding:5px 9px;border-radius:20px;border:2px solid var(--ink)}
@keyframes glow{50%{box-shadow:0 5px 0 var(--ink),0 0 0 6px rgba(255,111,163,.25)}}
.card.final{background:linear-gradient(135deg,#fff6d6,#ffe0ec)}
.card.final.locked{background:#f1ecf7}
footer{text-align:center;margin-top:24px;font:600 22px/1.3 var(--hand);color:var(--ink);opacity:.75}
.tiny{font-size:12px;opacity:.5;margin-top:6px;font-family:var(--round)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="kick">6 → 10 Nov</span>
    <h1>The Kunjus<br><span>Countdown</span></h1>
    <p class="sub">Five deliveries. One birthday. A new one unlocks every midnight.</p>
    <p class="hand">Bookmark this page. Come back every day. 🤍</p>
  </header>
  <div class="list" id="list"></div>
  <footer>See you at the finish line, Kunjus.<div class="tiny">Unlock times are midnight, India time.</div></footer>
</div>
<script>
const D = [
  { n: 1, at: '2026-11-06T00:00:00+05:30', date: '6 Nov', title: 'The Lost Treasure', desc: 'A quest. Bring Stetho.', ic: '🗺️', bg: '#ffe46b', href: 'day1/index.html' },
  { n: 2, at: '2026-11-07T00:00:00+05:30', date: '7 Nov', title: 'Your 2026 Wrapped', desc: 'Your year, in stats.', ic: '🎧', bg: '#7bf0b0', href: 'day2/index.html' },
  { n: 3, at: '2026-11-08T00:00:00+05:30', date: '8 Nov', title: 'Patient File', desc: 'Confidential. Very.', ic: '🩺', bg: '#9fe7f5', href: 'day3/index.html' },
  { n: 4, at: '2026-11-09T00:00:00+05:30', date: '9 Nov', title: 'T-minus Midnight', desc: 'Scratch for clues.', ic: '⏳', bg: '#c9a0ff', href: 'day4/index.html' },
  { n: 5, at: '2026-11-10T00:00:00+05:30', date: '10 Nov', title: 'Nandana Annual', desc: 'Volume 01. First edition. 🎂', ic: '📰', bg: '#ff9ec7', href: 'day5/index.html', final: true },
];
const PREVIEW = /[?&]preview=1/.test(location.search);
const list = document.getElementById('list');
const pad = x => String(x).padStart(2, '0');
function left(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), d = Math.floor(s / 86400);
  return (d ? d + 'd ' : '') + pad(Math.floor(s % 86400 / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60);
}
let lastKey = '';
function render() {
  const now = Date.now();
  const open = D.map(x => PREVIEW || now >= new Date(x.at).getTime());
  const latest = open.lastIndexOf(true);
  const key = open.join();
  if (key !== lastKey) {
    lastKey = key;
    list.innerHTML = D.map((x, i) => open[i]
      ? `<a class="card ${i === latest ? 'today' : ''} ${x.final ? 'final' : ''}" href="${x.href}"><span class="ic" style="background:${x.bg}">${x.ic}</span><span><span class="n">Delivery ${x.n} · ${x.date}</span><div class="t">${x.title}</div><div class="d">${x.desc}</div></span><span class="go">Open ▶</span></a>`
      : `<div class="card locked ${x.final ? 'final' : ''}"><span class="ic">🔒</span><span><span class="n">Delivery ${x.n} · ${x.date}</span><div class="t">${x.final ? 'The Big One' : 'Classified'}</div><div class="d">Unlocks ${x.date}, 12:00 AM</div></span><span class="go" data-i="${i}">--:--:--</span></div>`).join('');
  }
  list.querySelectorAll('.go[data-i]').forEach(g => g.textContent = left(new Date(D[+g.dataset.i].at).getTime() - now));
}
render(); setInterval(render, 1000);
</script>
</body>
</html>
